name: Broadcast Product Update

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/config/updates.json'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Broadcast API
        run: |
          curl -X POST ${{ secrets.NEXT_PUBLIC_BASE_URL }}/api/admin/broadcast \
          -H "Content-Type: application/json" \
          -d "{\"adminSecret\": \"${{ secrets.ADMIN_SECRET }}\"}"
