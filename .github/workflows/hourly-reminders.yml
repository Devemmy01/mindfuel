name: Hourly reflection reminders

# Sends each member's daily reminder at the local hour they chose.
# Runs on GitHub Actions so it works on any Vercel plan (Vercel Hobby
# crons are limited to once a day).
#
# Required repository settings:
#   secrets.CRON_SECRET  - same value as CRON_SECRET in Vercel (Production)
#   vars.APP_URL         - e.g. https://www.mind-fuel.app

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "CRON_SECRET secret or APP_URL variable is not configured; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/daily-prompt-notify"
